name: "Drift Check"
description: "Run drift to check for documentation drift"
author: "driftee-ai"
branding:
  icon: "check-circle"
  color: "green"
inputs:
  version:
    description: "Version of Drift CLI to use"
    required: false
    default: "v0.1.2"
  config:
    description: "Path to the .drift.yaml config file"
    required: false
    default: ".drift.yaml"
  gemini-api-key:
    description: "API key for the Gemini provider"
    required: false
  openai-api-key:
    description: "API key for the OpenAI provider"
    required: false
  changed-files:
    description: "A comma-separated list of changed files to check"
    required: false
  diff-only:
    description: "Only fail if the detected drift was caused by the provided git diff"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Install Drift
      env:
        DRIFT_VERSION: ${{ inputs.version }}
      run: |
        set -e
        echo "Installing Drift version $DRIFT_VERSION"
        VERSION_NO_V=${DRIFT_VERSION#v}
        # Currently hardcoded to Linux x86_64 for standard GitHub Runners
        DOWNLOAD_URL="https://github.com/driftee-ai/drift/releases/download/$DRIFT_VERSION/drift_${VERSION_NO_V}_Linux_x86_64.tar.gz"
        echo "Downloading from: $DOWNLOAD_URL"
        curl --fail -sSL "$DOWNLOAD_URL" -o drift.tar.gz
        tar -xzf drift.tar.gz drift
        sudo install drift /usr/local/bin/
      shell: bash

    - name: Run Drift Check
      env:
        GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        DRIFT_CONFIG: ${{ inputs.config }}
        CHANGED_FILES: ${{ inputs.changed-files }}
        DIFF_ONLY: ${{ inputs.diff-only }}
      run: |
        CMD="drift check --config \"$DRIFT_CONFIG\""
        
        if [ -n "$CHANGED_FILES" ]; then
          CMD="$CMD --changed-files \"$CHANGED_FILES\""
        fi
        
        if [ "$DIFF_ONLY" = "true" ]; then
          # Ensure fetch-depth: 0 was used in actions/checkout so we have history
          # Fallback to origin/main if base_ref is missing
          BASE_REF=${GITHUB_BASE_REF:-main}
          # Fetch just in case to ensure we have the remote branch
          git fetch origin $BASE_REF || true
          
          echo "Generating git diff against origin/$BASE_REF..."
          git diff origin/$BASE_REF...HEAD > pr.diff
          CMD="$CMD --diff-only --diff pr.diff"
        fi
        
        echo "Running: $CMD"
        eval "$CMD"
      shell: bash